<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>kbd</title></head>
<body>
<canvas id="game"></canvas>
<div id="result" style="position:fixed;top:0;left:0;color:#fff;background:#000;z-index:99;font:14px monospace;white-space:pre;"></div>
<script src="../js/adapter.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/skeleton.js"></script>
<script src="../js/effects.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/background.js"></script>
<script src="../js/fighter.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/input.js"></script>
<script src="../js/adManager.js"></script>
<script src="../js/scenes.js"></script>
<script src="../js/fightScene.js"></script>
<script src="../js/main.js"></script>
<script>
var vTime = 0;
window.requestAnimationFrame = function (cb) {
  return setTimeout(function () {
    vTime += 16.7;
    try { cb(vTime); } catch (e) {
      document.getElementById('result').textContent += '!! FRAME ERROR: ' + (e && e.message) + '\n';
      throw e;
    }
  }, 16);
};
SF.boot();
var R = document.getElementById('result');
function log(s) { R.textContent += s + '\n'; }
function mouse(type, dx, dy) {
  var p = { x: SF.view.ox + dx * SF.view.scale, y: SF.view.oy + dy * SF.view.scale };
  document.getElementById('game').dispatchEvent(new MouseEvent(type, { clientX: p.x, clientY: p.y, bubbles: true, cancelable: true }));
}
function key(type, code) {
  window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code === 'Space' ? ' ' : code, bubbles: true, cancelable: true }));
}
// 跳跃计数：监测 player.onGround true→false 下降沿
var jumps = 0, wasGround = true;
setInterval(function () {
  var c = SF.SceneManager.current();
  if (c && c.player) {
    if (wasGround && !c.player.onGround) jumps++;
    wasGround = c.player.onGround;
  }
}, 16);

setTimeout(function () { mouse('mousedown', 667, 356); mouse('mouseup', 667, 356); }, 500);   // 无限乱斗
setTimeout(function () { key('keydown', 'KeyW'); key('keyup', 'KeyW'); log('T1 按 W 跳一次'); }, 4000);
setTimeout(function () { log('T2 跳跃计数=' + jumps + '（期望 1）'); }, 6500);
setTimeout(function () {
  key('keydown', 'KeyJ'); key('keyup', 'KeyJ');
}, 7000);
setTimeout(function () {
  var c = SF.SceneManager.current();
  log('T3 按 J 后 move=' + (c.player ? c.player.move : '-') + ' 跳跃计数=' + jumps + '（期望仍 1）');
  key('keydown', 'KeyD');
}, 7600);
setTimeout(function () {
  var c = SF.SceneManager.current();
  log('T4 按住 D 移动: vx=' + (c.player ? c.player.vx.toFixed(0) : '-') + ' x=' + (c.player ? c.player.x.toFixed(0) : '-'));
  key('keyup', 'KeyD');
  log('T5 final 跳跃计数=' + jumps + ' → ' + (jumps === 1 ? 'PASS 无限跳已修复' : 'FAIL 仍连跳'));
  document.title = 'KBD-TEST-DONE';
}, 9500);
</script>
</body>
</html>
